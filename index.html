<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background-color: #7fa3d4;
    background-image:
      url('daisy.jpg'),
      linear-gradient(to bottom, #24509f 0%, #4472bc 38%, #8fadd7 70%, #dfe9f4 100%);
    background-size: cover, cover;
    background-position: center 24%, center;
    background-repeat: no-repeat;
    display: grid;
    place-items: center;
    min-height: 100svh;
    overflow: hidden;
    padding-top: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top));
    padding-right: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right));
    padding-bottom: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom));
    padding-left: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));
  }

  .loop {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 24%;
    opacity: 0;
    animation: appear 1.4s ease 0.4s forwards;
  }

  @keyframes appear {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .loop { display: none; }
  }

  h1 {
    color: #ffffff;
    position: relative;
    z-index: 1;
    top: min(4svh, 2.5rem);
    max-width: 100%;
    opacity: 0;
    transform: translateY(6px);
    animation: settle 1.8s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
  }

  h1 svg {
    display: block;
    margin-inline: auto;
    width: min(clamp(11rem, 34vmin, 20rem), 100%);
    height: auto;
    filter: drop-shadow(0 1px 18px rgba(24, 52, 105, 0.42));
  }

  .studio-line {
    color: rgba(7, 42, 96, 0.95);
    position: fixed;
    z-index: 1;
    right: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right));
    bottom: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom));
    left: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(0.75rem, 0.2vw + 0.7rem, 0.875rem);
    line-height: 1.35;
    letter-spacing: 0.01em;
    text-shadow: 0 1px 12px rgba(255, 255, 255, 0.18);
    opacity: 0;
    transform: translateY(4px);
    animation: caption-settle 1.2s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
  }

  /* Short landscape screens: keep the wordmark visually centred
     instead of pushing it towards the bottom edge */
  @media (max-height: 480px) {
    h1 { top: 4svh; }
    h1 svg { width: clamp(9rem, 30vmin, 20rem); }
  }

  /* Portrait phones: set the wordmark high, over the deep blue sky */
  @media (max-width: 600px) and (orientation: portrait) {
    body { place-items: start center; }
    h1 { top: 0; margin-top: 5.5svh; }
    h1 svg { width: 9.5rem; }
    .studio-line {
      left: auto;
      max-width: 13rem;
      text-align: right;
    }
  }

  @keyframes settle {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes caption-settle {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; opacity: 1; transform: none; }
    .studio-line { animation: none; opacity: 1; transform: none; }
  }
</style>
